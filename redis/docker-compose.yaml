version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-password123}
      --save 60 1 
      --loglevel warning 
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - redis_data:/data
    networks:
      - redis-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: always
    ports:
      - "${REDISINSIGHT_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight_data:/db
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge

volumes:
  redis_data:
  redisinsight_data:

